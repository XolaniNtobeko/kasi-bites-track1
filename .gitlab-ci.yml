stages:
  - test
  - build

variables:
  FLUTTER_VERSION: "3.19.0"

# Stage 1: Run unit and widget tests
test_flutter:
  stage: test
  image: debian:bullseye-slim
  before_script:
    - apt-get update && apt-get install -y curl git unzip xz-utils zip libglu1-mesa ca-certificates
    - git clone https://github.com/flutter/flutter.git /usr/local/flutter -b $FLUTTER_VERSION
    - export PATH="/usr/local/flutter/bin:/usr/local/flutter/bin/cache/dart-sdk/bin:$PATH"
    - flutter config --enable-web
  script:
    - flutter pub get
    - flutter test

# Stage 2: Build and push the Docker container to GitLab Registry
build_docker_image:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'